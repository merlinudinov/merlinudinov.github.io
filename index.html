<!DOCTYPE html>

    <style>
        /* Basic Page Styles */
        body {
            font-family: "Georgia", serif;
            background: #fff;
            color: #000;
            margin: 0;
            padding: 20px;
            line-height: 1.8;
        }
        h1, h2, h3 {
            font-family: "Merriweather", serif;
            text-align: center;
            font-weight: normal;
            margin: 10px 0;
        }
        h1 {
            font-size: 3rem;
            text-transform: uppercase;

        }

        }
        h3 {

        }
        p, ul {
            font-size: 1rem;
            text-align: justify;
            margin: 0 0 20px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li::before {
            content: "—";
            margin-right: 10px;
        }
        a {
            color: #000;
            text-decoration: none;
            border-bottom: 1px dotted #000;
            transition: border-bottom 0.3s ease;
        }
        a:hover {
            border-bottom: 1px solid #000;
        }
        /* Layout */
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 10px 20px;
        }
        header {
            margin-bottom: 50px;
        }
        footer {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #000;
