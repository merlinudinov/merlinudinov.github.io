<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Academic Website</title>
    <style>
        /* Basic Page Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: "Merriweather", Georgia, serif;
            background: #f4f4f4;
            color: #000;
        }
        h1 {
            font-size: 3rem;
            text-transform: small-caps;
            letter-spacing: 2px;
            text-align: center;
            margin: 0;
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        p, ul, a {
            font-size: 1rem;
            text-align: justify;
            color: #000;
            text-decoration: none;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li::before {
            content: "•";
            color: #555;
            margin-right: 5px;
        }

        /* Irregular Graphic Shapes */
        .shape {
            position: absolute;
            background: #000;
            opacity: 0.7;
            border-radius: 10%;
        }
        .shape1 {
            width: 250px;
            height: 300px;
            top: 10%;
            left: 20%;
            background: #333;
        }
        .shape2 {
            width: 150px;
            height: 200px;
            top: 50%;
            left: 60%;
            background: #666;
            transform: rotate(15deg);
        }
        .shape3 {
            width: 100px;
            height: 100px;
            bottom: 10%;
            left: 15%;
            background: #999;
        }
        .shape4 {
            width: 200px;
            height: 200px;
            top: 35%;
            right: 10%;
            background: #444;
            transform: rotate(-10deg);
        }

        /* Content Container */
        .container {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            z-index: 20;
            padding: 20px;
        }
        .section {
            margin: 40px 0;
        }
        .section h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
        }

        /* Footer */
        footer {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 40px;
            padding-top: 10px;
            background: #222;
            color: #eee;
        }
    </style>
</head>
<body>
    <!-- Background Shapes -->
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
    <div class="shape shape4"></div>

    <!-- Header -->
    <h1>Merlin Balkhash</h1>

    <!-- Main Content -->
    <div class="container">
        <div class="section" id="about">
            <h2>About Me</h2>
            <p>Hello! I’m <strong>Merlin Balkhash Udinov</strong>.</p>
        </div>

        <div class="section" id="research">
            <h2>Research</h2>
            <ul>
                <li><a href="https://example.com">Title of Paper 1</a></li>
                <li><a href="https://example.com">Title of Paper 2</a></li>
                <li><a href="https://example.com">Title of Paper 3</a></li>
            </ul>
        </div>

        <div class="section" id="contact">
            <h2>Contact</h2>
            <p>Email: <a href="mailto:your.email@example.com">your.email@example.com</a></p>
            <p>GitHub: <a href="https://github.com/yourusername">https://github.com/yourusername</a></p>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 [Your Name]. All rights reserved.</p>
    </footer>
</body>
</html>
